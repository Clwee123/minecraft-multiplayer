<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Minecraft Classic</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas { display: block; }

    /* ── Loading screen ─────────────────────────────────────────── */
    #loadingScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #87ceeb 0%, #b0e0f8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 1000;
      color: #ffffff;
    }
    #loadingScreen h1 {
      font-size: 3rem;
      margin: 0 0 0.5rem 0;
      text-shadow: 3px 3px 0 #2a2a2a;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      letter-spacing: 2px;
    }
    #loadingScreen .subtitle {
      color: #ffffff;
      font-size: 1rem;
      text-shadow: 1px 1px 0 #2a2a2a;
      margin-bottom: 2rem;
    }
    #loadingScreen .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #buildStamp {
      position: fixed;
      bottom: 6px;
      left: 8px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      font-family: monospace;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
      z-index: 50;
      pointer-events: none;
    }

    /* ── Crosshair ──────────────────────────────────────────────── */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }
    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      background: #ffffff;
      mix-blend-mode: difference;
    }
    #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
    #crosshair::after  { top: 9px; left: 0; height: 2px; width: 20px; }

    /* ── Hotbar ─────────────────────────────────────────────────── */
    #hotbar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      padding: 3px;
      background: rgba(0,0,0,0.55);
      border: 2px solid rgba(0,0,0,0.7);
      border-radius: 2px;
      z-index: 20;
    }
    .hotbar-slot {
      position: relative;
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hotbar-slot.active {
      border-color: #ffffff;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.5);
    }
    .hotbar-slot .slot-icon {
      pointer-events: none;
    }
    .hotbar-slot .slot-num {
      position: absolute;
      bottom: -1px;
      right: 2px;
      font-size: 10px;
      font-family: monospace;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
      pointer-events: none;
    }

    /* ── Block name (selected hotbar slot) ──────────────────────── */
    #blockName {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      text-shadow: 2px 2px 0 #000;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 15;
    }

    /* ── Controls help (top-left, fades out) ────────────────────── */
    #helpHud {
      position: fixed;
      top: 10px;
      left: 12px;
      color: rgba(255,255,255,0.85);
      font-family: 'Courier New', monospace;
      font-size: 12px;
      text-shadow: 1px 1px 0 #000;
      line-height: 1.5em;
      z-index: 30;
      pointer-events: none;
    }
    #helpHud b { color: #ffe66d; }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loadingScreen">
    <h1>MINECRAFT</h1>
    <div class="subtitle">Classic Edition</div>
    <div class="spinner"></div>
    <p style="color:#fff;margin-top:1rem;font-size:0.85rem;text-shadow:1px 1px 0 #2a2a2a;">Generating world…</p>
  </div>

  <!-- HUD -->
  <div id="crosshair"></div>
  <div id="hotbar"></div>
  <div id="blockName"></div>
  <div id="helpHud">
    <div><b>WASD</b> move · <b>Space</b> jump · <b>2×Space</b> fly</div>
    <div><b>Mouse</b> look · <b>LMB</b> break · <b>RMB</b> place</div>
    <div><b>1-9</b> / <b>scroll</b> select block</div>
  </div>
  <div id="buildStamp">build: ...</div>

  <script type="module" src="/src/classic/main.ts"></script>
</body>
</html>
